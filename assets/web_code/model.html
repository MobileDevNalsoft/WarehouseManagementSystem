<html>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>3D Model</title>
  <link rel="stylesheet" type="text/css" href="style.css" />
  <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@latest/build/three.module.js",
          "orbitControls": "https://cdn.jsdelivr.net/npm/three@latest/examples/jsm/controls/OrbitControls.js",
          "bufferGeometryUtils": "https://cdn.jsdelivr.net/npm/three@latest/examples/jsm/utils/BufferGeometryUtils.js",
          "gltfLoader": "https://cdn.jsdelivr.net/npm/three@latest/examples/jsm/loaders/GLTFLoader.js",
          "draco":"https://cdn.jsdelivr.net/npm/three@0.114.0/examples/jsm/loaders/DRACOLoader.js",
          "animations": "./animations.js",
          "renderer": "./renderer.js",
          "scene": "./sceneSetup.js",
          "camera": "./camera.js",
          "controls": "./controls.js",
          "loader": "./modelLoader.js",
          "skyDome": "./skyDome.js",
          "lights": "./lights.js",
          "interactions": "./interactions.js",
          "navPath": "./navigation_path.js",
          "highlight": "./highlight.js",
          "lpnLifeCycle": "./lpnLifeCycle.js",
          "initFunctions": "./initFunctions.js"
        }
      }
    </script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
</head>

<body>
  <div id="container" >
     <div id="leftPanel" class="ignoreRaycast">
      <!-- Areas Button -->
      <div class="areaButton ignoreRaycast" id="areas">
          <img class="ignoreRaycast" src="./areas.svg" alt="areas">
          <p id="area_tooltip"  class="ignoreRaycast"> Areas</p>
      </div>
      <!-- Shortest Path Button -->
      <div class="areaButton ignoreRaycast" id="path" display="block">
         
        <img class="ignoreRaycast" src="./path.svg" alt="areas">
          <p id="area_tooltip"  class="ignoreRaycast"> Shortest Path</p>
      </div>
      <div class="areaButton ignoreRaycast" id="digitalTwin" display="block">
        <img class="ignoreRaycast" src="./cube.svg" alt="areas">
        <p id="area_tooltip"  class="ignoreRaycast"> Digital Twin </p>
    </div>
  </div>
  </div>
    </div>
  </div>
  <div id="tooltip">Tooltip Data</div>
  <div id="agvtooltip">
    <strong style="display: block; text-align: center; margin: 5px;">AGV1</strong>
    <div class="tooltip-content">
      LPN : IBPAIDL00001618<br>
      Putaway : 5RB30602<br>
      LPN : IBPAIDL00001619<br>
      Putaway : 3RB20602
    </div>
  </div>
  
  <script type="module" src="./index.js"></script>
  <div id="arrows-container">
    <button id="arrow-up" class="arrow ignoreRaycast">▲</button>
    <button id="arrow-left" class="arrow ignoreRaycast">◄</button>
    <button id="arrow-right" class="arrow ignoreRaycast">►</button>
    <button id="arrow-down" class="arrow ignoreRaycast">▼</button>
  </div>
  <div id="image-button-container" class="ignoreRaycast">
    <img id="image-button" class="ignoreRaycast" src="./man.png" alt="Button Image" />
  </div>
  <script src="https://www.gstatic.com/dialogflow-console/fast/messenger/bootstrap.js?v=1"></script>
  <df-messenger
    id="wms-bot"
    class="ignoreRaycast"
    intent="WELCOME"
    chat-title="WMS BOT"
    agent-id="d34e4cdc-6ecd-49b5-b1db-ad393cc5d097"
    language-code="en"
    chat-icon="./robot.png"
  ></df-messenger>

  <div id="functionalButtons">
    <div id="showPath">
    </div>
    <div id="stopAnimation"></div>

</body>

</html>
