<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Google Maps + Three.js 3D Model</title>
  <script
    src="https://maps.googleapis.com/maps/api/js?key=AIzaSyAVj-M7IeRW2u9xndAMvqxg94Luwalip38&libraries=maps,places"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.136.0/examples/js/loaders/GLTFLoader.js"></script>
  <style>
    html,
    body,
    #map {
      height: 100%;
      margin: 0;
      padding: 0;
    }

    canvas {
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1000;
    }
  </style>
</head>

<body>
  <div id="map"></div>

  <script>
    function displayMap() {
      const mapOptions = {
        center: { lat: -33.860664, lng: 151.208138 },
        zoom: 14
      };
      const mapDiv = document.getElementById('map');
      const map = new google.maps.Map(mapDiv, mapOptions);
      return map;
    }

    function addMarkers(map) {
      const locations = {
        operaHouse: { lat: -33.8567844, lng: 151.213108 },
        tarongaZoo: { lat: -33.8472767, lng: 151.2188164 },
        manlyBeach: { lat: -33.8209738, lng: 151.2563253 },
        hyderPark: { lat: -33.8690081, lng: 151.2052393 },
        theRocks: { lat: -33.8587568, lng: 151.2058246 },
        circularQuay: { lat: -33.858761, lng: 151.2055688 },
        harbourBridge: { lat: -33.852228, lng: 151.2038374 },
        kingsCross: { lat: -33.8737375, lng: 151.222569 },
        botanicGardens: { lat: -33.864167, lng: 151.216387 },
        museumOfSydney: { lat: -33.8636005, lng: 151.2092542 },
        maritimeMuseum: { lat: -33.869395, lng: 151.198648 },
        kingStreetWharf: { lat: -33.8665445, lng: 151.1989808 },
        aquarium: { lat: -33.869627, lng: 151.202146 },
        darlingHarbour: { lat: -33.87488, lng: 151.1987113 },
        barangaroo: { lat: - 33.8605523, lng: 151.1972205 }
      }
      const markers = [];
      for (const location in locations) {
        const markerOptions = {
          map: map,
          position: locations[location],
          
          // icon: './img/custom_pin.png'
        }
        const marker = new google.maps.Marker(markerOptions);
        markers.push(marker);
      }
      return markers;
    }


    function initMap() {
      const map = displayMap();
      // const markers = addMarkers(map);
      initThreeJS();


      
    }

    function initThreeJS() {
      scene = new THREE.Scene();
      camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
      renderer = new THREE.WebGLRenderer({ alpha: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      document.body.appendChild(renderer.domElement);

      loader = new THREE.GLTFLoader();

      const locations = [
        { lat: -33.8567844, lng: 151.213108 }, // Opera House
        { lat: -33.8472767, lng: 151.2188164 }, // Taronga Zoo
        { lat: -33.8209738, lng: 151.2563253 }  // Manly Beach
      ];

      locations.forEach(location => {
        add3DObject(location.lat, location.lng);
      });

      animate();
    }

    function add3DObject(lat, lng) {
      loader.load('../glbs/agv_with_boxes.glb', function(gltf) {
        const model = gltf.scene;
        const position = latLngToVector3(lat, lng);
        model.position.set(position.x, position.y, position.z);
        model.scale.set(5, 5, 5); // Adjust size
        scene.add(model);
      });
    }

    function latLngToVector3(lat, lng) {
      const scale = 1000; // Adjust for model placement
      return {
        x: (lng - map.getCenter().lng()) * scale,
        y: (map.getCenter().lat() - lat) * scale,
        z: 0
      };
    }

    function animate() {
      requestAnimationFrame(animate);
      renderer.render(scene, camera);
    }


    window.onload = initMap;
  </script>
</body>

</html>
